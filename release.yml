name: Release

# Runs when you publish a release on GitHub (tag like v1.0.1).
# It builds the plugin, attaches the zip to that release and adds the new version to manifest.json.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
      NOTES: ${{ github.event.release.body }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Work out the version from the tag
        run: |
          V="${TAG#v}"
          if [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then V="$V.0"; fi
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The tag '$TAG' must look like v1.0.1"
            exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Build
        run: >
          dotnet publish Jellyfin.Plugin.VideoFilters.csproj -c Release -o out
          -p:AssemblyVersion=$VERSION -p:FileVersion=$VERSION

      - name: Package
        run: |
          mkdir package
          cp out/Jellyfin.Plugin.VideoFilters.dll package/
          jq --arg v "$VERSION" \
             --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             --arg log "${NOTES:-Release $TAG}" \
             '.version = $v | .timestamp = $ts | .changelog = $log' \
             meta.json > package/meta.json
          ZIP="Jellyfin.Plugin.VideoFilters_${VERSION}.zip"
          (cd package && zip -r "../$ZIP" .)
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "CHECKSUM=$(md5sum "$ZIP" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "TARGET_ABI=$(jq -r .targetAbi meta.json)" >> "$GITHUB_ENV"

      - name: Attach the zip to the release
        run: gh release upload "$TAG" "$ZIP" --clobber

      - name: Add the new version to manifest.json
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP}"
          git fetch origin main
          git checkout main
          jq --arg v "$VERSION" \
             --arg url "$URL" \
             --arg sum "$CHECKSUM" \
             --arg abi "$TARGET_ABI" \
             --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             --arg log "${NOTES:-Release $TAG}" \
             '.[0].versions = ([{version: $v, changelog: $log, targetAbi: $abi, sourceUrl: $url, checksum: $sum, timestamp: $ts}] + ((.[0].versions // []) | map(select(.version != $v))))' \
             manifest.json > manifest.tmp
          mv manifest.tmp manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Add version ${VERSION} to manifest.json"
          git push origin main
